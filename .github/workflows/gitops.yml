name: GitOps Build and Publish

on:
  push:
    branches:
      - gitops
    paths-ignore:
      - 'helm/hello-world/values.yaml'

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tech-challenge-2-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gitops

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            ./app

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Update Helm image tag
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          sed -i "s/tag: \".*\"/tag: \"$IMAGE_TAG\"/" helm/hello-world/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/hello-world/values.yaml
          git commit -m "Update image tag to ${GITHUB_SHA::7}" || exit 0
          git push origin gitops